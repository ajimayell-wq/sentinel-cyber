name: Site
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/site.yml']
  workflow_dispatch:
concurrency:
  group: site
  cancel-in-progress: true
jobs:
  cloudflare:
    runs-on: ubuntu-latest
    if: ${{ vars.NOPE != '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Déployer sur Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy web --project-name=sentinel-cyber --branch=main --commit-dirty=true
